<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Data Cipher Console</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d0d0d;
      color: #e6e6e6;
      max-width: 650px;
      margin: 20px auto;
      padding: 15px;
      transition: background 0.4s, color 0.4s;
    }

    h1 {
      text-align: center;
      font-weight: 700;
      color: #00e0ff;
      text-shadow: 0 0 10px #00e0ff;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      height: 130px;
      background: #141414;
      border: 1px solid #222;
      color: #00e0ff;
      padding: 12px;
      font-size: 1rem;
      border-radius: 12px;
      resize: none;
    }

    button {
      padding: 12px 18px;
      margin: 6px 6px 6px 0;
      background: #00e0ff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      color: black;
      font-weight: bold;
      width: 31%;
    }

    button:hover {
      transform: scale(1.05);
    }

    #lock {
      background: #111;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid #222;
      box-shadow: 0 0 15px #00e0ff55;
    }

    /* Glitch ONLY for encode/decode */
    .glitch {
      animation: glitchAnim 0.35s steps(2, end);
    }

    @keyframes glitchAnim {
      0% { transform: skew(0deg); opacity: 1; }
      20% { transform: skew(8deg); opacity: 0.7; }
      40% { transform: skew(-8deg); opacity: 0.6; }
      60% { transform: skew(4deg); opacity: 0.8; }
      80% { transform: skew(-4deg); opacity: 0.9; }
      100% { transform: skew(0deg); opacity: 1; }
    }

    /* Fake Google Classroom page */
    #schoolPage {
      display: none;
      background: #f5f5f5;
      color: black;
      padding: 0;
      border-radius: 8px;
    }

    .stealth {
      background: black !important;
      color: black !important;
    }
  </style>
</head>

<body>

  <h1 id="title">Data Cipher Console</h1>

  <!-- PASSWORD LOCK -->
  <div id="lock">
    <p>Enter password to unlock:</p>
    <input id="pw" type="password" style="width:100%;padding:10px;font-size:1rem;border-radius:8px;">
    <button id="unlockBtn">Unlock</button>
    <p id="msg" style="color:#ff4444;"></p>
  </div>

  <!-- FAKE GOOGLE CLASSROOM PAGE -->
  <div id="schoolPage">
    <div style="background:#1a73e8;color:white;padding:16px 20px;border-radius:8px 8px 0 0;">
      <h2 style="margin:0;font-size:22px;">Classwork</h2>
      <p style="margin:4px 0 0 0;font-size:14px;">Year 5/6 • Room A</p>
    </div>

    <div style="padding:16px 20px;">
      <div style="background:white;padding:16px;border-radius:8px;border:1px solid #ddd;margin-bottom:15px;">
        <h3 style="margin:0;font-size:18px;">Literacy – Weekly Reading Task</h3>
        <p style="margin:6px 0 0 0;color:#555;">Posted by Ms. Carter • Due tomorrow</p>
      </div>

      <div style="background:white;padding:16px;border-radius:8px;border:1px solid #ddd;margin-bottom:15px;">
        <h3 style="margin:0;font-size:18px;">Numeracy – Practice Questions</h3>
        <p style="margin:6px 0 0 0;color:#555;">Posted by Ms. Carter • Due Friday</p>
      </div>

      <div style="background:white;padding:16px;border-radius:8px;border:1px solid #ddd;margin-bottom:15px;">
        <h3 style="margin:0;font-size:18px;">Inquiry – Project Check‑In</h3>
        <p style="margin:6px 0 0 0;color:#555;">Updated today</p>
      </div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app" style="display:none;">
    <h3>Input</h3>
    <textarea id="input"></textarea>
    <p id="count" style="color:#00e0ff;">0 characters</p>

    <div style="margin-top:10px;">
      <button id="encodeBtn">Encode</button>
      <button id="decodeBtn">Decode</button>
      <button id="copyBtn">Copy Output</button>
    </div>

    <h3 style="margin-top:20px;">Output</h3>
    <textarea id="output" readonly></textarea>
  </div>

  <script>
    const PASSWORD = "yrps2026";

    const lockDiv = document.getElementById("lock");
    const appDiv = document.getElementById("app");
    const schoolPage = document.getElementById("schoolPage");
    const titleEl = document.getElementById("title");
    const pwInput = document.getElementById("pw");
    const msgEl = document.getElementById("msg");

    let unlocked = false;
    let fake = false;
    let stealth = false;

    /* FIXED LOGIN — NO GLITCH, NO DISAPPEAR */
    document.getElementById("unlockBtn").onclick = () => {
      const pw = pwInput.value.trim();

      if (pw === PASSWORD) {
        unlocked = true;
        lockDiv.style.display = "none";
        schoolPage.style.display = "none";
        appDiv.style.display = "block";
        titleEl.textContent = "Data Cipher Console";
      } else {
        msgEl.textContent = "Incorrect password.";
      }
    };

    /* CHAOS MAP */
    const MAP = {
      a:"x9@p!", b:"k1#z%", c:"q8$r&", d:"m4!t@", e:"v7^b*",
      f:"p2&c$", g:"s5!n#", h:"r3@l%", i:"w6#h&", j:"z1!q*",
      k:"u8@d$", l:"y4#f%", m:"t9!g&", n:"o2@k*", o:"i7#j$",
      p:"e5!m%", q:"c3@v&", r:"b6#x$", s:"n1!s@", t:"h8#p%",
      u:"g4!r&", v:"f7@t$", w:"d9#u%", x:"a2!w&", y:"j5@y$",
      z:"l3#o%", " ":"___"
    };

    const REVERSE = Object.fromEntries(
      Object.entries(MAP).map(([k, v]) => [v, k])
    );

    function encode(text) {
      return text.split("").map(ch => MAP[ch] ?? ch).join(" ");
    }

    function decode(text) {
      return text.split(" ").map(t => REVERSE[t] ?? t).join("");
    }

    const input = document.getElementById("input");
    const output = document.getElementById("output");

    document.getElementById("encodeBtn").onclick = () => {
      output.value = encode(input.value);
      output.classList.add("glitch");
      setTimeout(() => output.classList.remove("glitch"), 350);
    };

    document.getElementById("decodeBtn").onclick = () => {
      output.value = decode(input.value);
      output.classList.add("glitch");
      setTimeout(() => output.classList.remove("glitch"), 350);
    };

    document.getElementById("copyBtn").onclick = () => {
      navigator.clipboard.writeText(output.value);
      alert("Copied!");
    };

    input.addEventListener("input", () => {
      document.getElementById("count").textContent =
        input.value.length + " characters";
    });

    /* STEALTH MODE (S) */
    document.addEventListener("keydown", (e) => {
      if (e.key.toLowerCase() === "s") {
        stealth = !stealth;
        document.body.classList.toggle("stealth", stealth);
      }
    });

    /* PANIC KEY (ESC) */
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && unlocked) {
        input.value = "";
        output.value = "";
        appDiv.style.display = "none";
        schoolPage.style.display = "block";
        titleEl.textContent = "Classwork";
        fake = true;
      }
    });

    /* FAKE CLASSROOM TOGGLE (F) — FIXED */
    document.addEventListener("keydown", (e) => {
      if (e.key.toLowerCase() === "f" && unlocked) {
        fake = !fake;

        if (fake) {
          appDiv.style.display = "none";
          schoolPage.style.display = "block";
          titleEl.textContent = "Classwork";
        } else {
          schoolPage.style.display = "none";
          appDiv.style.display = "block";
          titleEl.textContent = "Data Cipher Console";
        }
      }
    });
  </script>

</body>
</html>
