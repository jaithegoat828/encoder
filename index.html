<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Data Cipher Console</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d0d0d;
      color: #e6e6e6;
      max-width: 650px;
      margin: 20px auto;
      padding: 15px;
      transition: background 0.4s, color 0.4s;
    }

    h1 {
      text-align: center;
      font-weight: 700;
      color: #00e0ff;
      text-shadow: 0 0 10px #00e0ff;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      height: 130px;
      background: #141414;
      border: 1px solid #222;
      color: #00e0ff;
      padding: 12px;
      font-size: 1rem;
      border-radius: 12px;
      resize: none;
      transition: background 0.3s;
    }

    button {
      padding: 12px 18px;
      margin: 6px 6px 6px 0;
      background: #00e0ff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      color: black;
      font-weight: bold;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s;
      width: 31%;
    }

    button:hover {
      transform: scale(1.05);
    }

    button::after {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 120%;
      height: 100%;
      background: linear-gradient(120deg, transparent, #00e0ff55, transparent);
      transition: 0.4s;
    }

    button:hover::after {
      left: 120%;
    }

    #lock {
      background: #111;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid #222;
      box-shadow: 0 0 15px #00e0ff55;
    }

    .fade-in {
      opacity: 0;
      transform: translateY(10px);
      animation: fadeIn 0.5s ease forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .glitch {
      animation: glitchAnim 0.35s steps(2, end);
    }

    @keyframes glitchAnim {
      0% { transform: skew(0deg); opacity: 1; }
      20% { transform: skew(8deg); opacity: 0.7; }
      40% { transform: skew(-8deg); opacity: 0.6; }
      60% { transform: skew(4deg); opacity: 0.8; }
      80% { transform: skew(-4deg); opacity: 0.9; }
      100% { transform: skew(0deg); opacity: 1; }
    }

    /* Fake Google Classroom page */
    #schoolPage {
      display: none;
      background: white;
      color: black;
      padding: 0;
      border-radius: 8px;
    }

    .stealth {
      background: black !important;
      color: black !important;
    }
  </style>
</head>

<body>

  <h1 id="title">Data Cipher Console</h1>

  <!-- PASSWORD LOCK -->
  <div id="lock">
    <p>Enter password to unlock:</p>
    <input id="pw" type="password" style="width:100%;padding:10px;font-size:1rem;border-radius:8px;">
    <button id="unlockBtn">Unlock</button>
    <p id="msg" style="color:#ff4444;"></p>
  </div>

  <!-- FAKE GOOGLE CLASSROOM PAGE -->
  <div id="schoolPage">
    <div style="background:#1a73e8;color:white;padding:16px;border-radius:8px;margin-bottom:20px;">
      <h2 style="margin:0;font-size:22px;">Classwork</h2>
      <p style="margin:4px 0 0 0;font-size:14px;">English – Year 8</p>
    </div>

    <div style="background:white;color:black;padding:16px;border-radius:8px;border:1px solid #ddd;margin-bottom:15px;">
      <h3 style="margin:0;font-size:18px;">Weekly Reading Task</h3>
      <p style="margin:6px 0 0 0;font-size:14px;color:#555;">Posted by Ms. Carter • Due tomorrow</p>
    </div>

    <div style="background:white;color:black;padding:16px;border-radius:8px;border:1 solid #ddd;margin-bottom:15px;">
      <h3 style="margin:0;font-size:18px;">Vocabulary Worksheet</h3>
      <p style="margin:6px 0 0 0;font-size:14px;color:#555;">Posted by Ms. Carter • Due Friday</p>
    </div>

    <div style="background:white;color:black;padding:16px;border-radius:8px;border:1px solid #ddd;margin-bottom:15px;">
      <h3 style="margin:0;font-size:18px;">Classroom Announcements</h3>
      <p style="margin:6px 0 0 0;font-size:14px;color:#555;">Updated today</p>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app" style="display:none;">
    <h3>Input</h3>
    <textarea id="input"></textarea>
    <p id="count" style="color:#00e0ff;">0 characters</p>

    <div style="margin-top:10px;">
      <button id="encodeBtn">Encode</button>
      <button id="decodeBtn">Decode</button>
      <button id="copyBtn">Copy Output</button>
    </div>

    <h3 style="margin-top:20px;">Output</h3>
    <textarea id="output" readonly></textarea>
  </div>

  <script>
    const PASSWORD = "yrps2026";

    document.getElementById("unlockBtn").onclick = () => {
      const pw = document.getElementById("pw").value;

      if (pw === PASSWORD) {
        document.getElementById("lock").style.display = "none";
        const app = document.getElementById("app");
        app.style.display = "block";
        app.classList.add("fade-in", "glitch");
      } else {
        document.getElementById("msg").textContent = "Incorrect password.";
      }
    };

    /* CHAOS MAP */
    const MAP = {
      a:"x9@p!", b:"k1#z%", c:"q8$r&", d:"m4!t@", e:"v7^b*",
      f:"p2&c$", g:"s5!n#", h:"r3@l%", i:"w6#h&", j:"z1!q*",
      k:"u8@d$", l:"y4#f%", m:"t9!g&", n:"o2@k*", o:"i7#j$",
      p:"e5!m%", q:"c3@v&", r:"b6#x$", s:"n1!s@", t:"h8#p%",
      u:"g4!r&", v:"f7@t$", w:"d9#u%", x:"a2!w&", y:"j5@y$",
      z:"l3#o%", " ":"___",

      "0":"@1x!9", "1":"#4p$2", "2":"%7q&5", "3":"!8r@3",
      "4":"$6s#1", "5":"&9t%4", "6":"*2u!7", "7":"^5v&8",
      "8":"~3w#6", "9":"?1z$0",

      ".":"p@!3#", ",":"v#2$!", "!":"m%4@&", "?":"s*7#^",
      "-":"q!8$@", "_":"z#1&*", "=":"x%5!^", "+":"k&9@#",
      "/":"h*3$!", "\\":"o^7!%", "'":"t$2#&", "\"":"g!6@*",
      ":":"b#9$!", ";":"n%4@^", "[":"e&1!#", "]":"r*8$%",
      "{":"c^5@!", "}":"y$3#&", "(":"u!7@%", ")":"i#2$*",
      "<":"j&6!^", ">":"l*9@#", "@":"a^4$!", "#":"d!1&*",
      "$":"f#8@%", "%":"h%3$!", "^":"w&7!#", "&":"p*2@^",
      "*":"q^6$!", "~":"s!9&*", "`":"t#5@%", "|":"k$1!&"
    };

    const REVERSE = Object.fromEntries(
      Object.entries(MAP).map(([k, v]) => [v, k])
    );

    function encode(text) {
      return text.split("").map(ch => MAP[ch] ?? ch).join(" ");
    }

    function decode(text) {
      return text.split(" ").map(t => REVERSE[t] ?? t).join("");
    }

    const input = document.getElementById("input");
    const output = document.getElementById("output");

    document.getElementById("encodeBtn").onclick = () => {
      output.value = encode(input.value);
      output.classList.add("glitch");
      setTimeout(() => output.classList.remove("glitch"), 350);
    };

    document.getElementById("decodeBtn").onclick = () => {
      output.value = decode(input.value);
      output.classList.add("glitch");
      setTimeout(() => output.classList.remove("glitch"), 350);
    };

    document.getElementById("copyBtn").onclick = () => {
      navigator.clipboard.writeText(output.value);
      alert("Copied!");
    };

    input.addEventListener("input", () => {
      document.getElementById("count").textContent =
        input.value.length + " characters";
    });

    /* STEALTH MODE (S) */
    let stealth = false;

    document.addEventListener("keydown", (e) => {
      if (e.key.toLowerCase() === "s") {
        stealth = !stealth;
        document.body.classList.toggle("stealth", stealth);
      }
    });

    /* PANIC KEY (ESC) */
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        input.value = "";
        output.value = "";
        document.getElementById("app").style.display = "none";
        document.getElementById("schoolPage").style.display = "block";
        document.getElementById("title").textContent = "Classwork";
      }
    });

    /* FAKE GOOGLE CLASSROOM MODE (F) */
    let fake = false;

    document.addEventListener("keydown", (e) => {
      if (e.key.toLowerCase() === "f") {
        fake = !fake;

        if (fake) {
          document.getElementById("app").style.display = "none";
          document.getElementById("schoolPage").style.display = "block";
          document.getElementById("title").textContent = "Classwork";
        } else {
          document.getElementById("schoolPage").style.display = "none";
          document.getElementById("app").style.display = "block";
          document.getElementById("title").textContent = "Data Cipher Console";
        }
      }
    });
  </script>

</body>
</html>
