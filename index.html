<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Custom Encoder</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 600px;
        margin: 20px auto;
        padding: 10px;
      }
      textarea {
        width: 100%;
        height: 120px;
        margin-bottom: 10px;
        font-size: 1rem;
      }
      button {
        margin-right: 8px;
        padding: 8px 14px;
        font-size: 1rem;
      }
      h1 { text-align: center; }
    </style>
  </head>
  <body>
    <h1>Custom Encoder</h1>

    <h3>Input</h3>
    <textarea id="input"></textarea>

    <div>
      <button id="encodeBtn">Encode</button>
      <button id="decodeBtn">Decode</button>
    </div>

    <h3>Output</h3>
    <textarea id="output" readonly></textarea>

    <script>
      // -------------------------------
      // FULL CUSTOM LANGUAGE MAP
      // -------------------------------
      const MAP = {
        a: "102hij",
        b: "203klo",
        c: "304vex",
        d: "405mir",
        e: "506tal",
        f: "607piv",
        g: "708lur",
        h: "809sef",
        i: "910wok",
        j: "111qaz",
        k: "212xed",
        l: "313cuv",
        m: "414bim",
        n: "515nop",
        o: "616rav",
        p: "717sol",
        q: "818zun",
        r: "919kel",
        s: "121lop",
        t: "222miv",
        u: "323wex",
        v: "424yil",
        w: "525jur",
        x: "626qer",
        y: "727fim",
        z: "828voz",
        " ": "___"
      };

      // Reverse map for decoding
      const REVERSE = Object.fromEntries(
        Object.entries(MAP).map(([k, v]) => [v, k])
      );

      // -------------------------------
      // ENCODE
      // -------------------------------
      function encode(text) {
        return text
          .toLowerCase()
          .split("")
          .map(ch => MAP[ch] ?? ch)
          .join(" ");
      }

      // -------------------------------
      // DECODE
      // -------------------------------
      function decode(text) {
        return text
          .split(" ")
          .map(token => REVERSE[token] ?? token)
          .join("");
      }

      // -------------------------------
      // UI HOOKS
      // -------------------------------
      const input = document.getElementById("input");
      const output = document.getElementById("output");

      document.getElementById("encodeBtn").onclick = () => {
        output.value = encode(input.value);
      };

      document.getElementById("decodeBtn").onclick = () => {
        output.value = decode(input.value);
      };
    </script>
  </body>
</html>
